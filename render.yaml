# Render Blueprint for FileConverter Pro Backend
# Deploy 100% FREE without credit card or database fees!

services:
  - type: web
    name: fileconverter-backend-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GUEST_DAILY_LIMIT
        value: "20"
      - key: FRONTEND_URL
        value: "https://fileconverter-frontend-fawn.vercel.app"
      - key: ALLOWED_ORIGINS
        value: "https://fileconverter-frontend-fawn.vercel.app,http://localhost:3000,http://localhost:8080"
