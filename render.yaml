# Render Infrastructure Blueprint for FileConverter Pro Backend
# Deploy automatically by importing your GitHub repo hamdiouni/fileconverter-backend on render.com

services:
  # Nginx API Gateway & Combined Microservice Stack
  - type: web
    name: fileconverter-backend-api
    env: docker
    dockerfilePath: ./services/api-gateway/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fileconverter-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fileconverter-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GUEST_DAILY_LIMIT
        value: "20"

databases:
  - name: fileconverter-db
    databaseName: fileconverter
    user: fileconverter_user
    plan: free
    region: oregon

# Redis Cache Service
services:
  - type: redis
    name: fileconverter-redis
    plan: free
    region: oregon
    ipAllowList: [] # internal access only
