worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Structured access log (JSON) ──────────────────────────────────────────
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # Keyed by $binary_remote_addr (16 bytes) — 10m stores ~160k IPs
    limit_req_zone $binary_remote_addr zone=free_limit:10m    rate=100r/h;
    limit_req_zone $binary_remote_addr zone=pro_limit:10m     rate=10000r/h;
    limit_req_zone $binary_remote_addr zone=biz_limit:10m     rate=100000r/h;
    limit_req_zone $binary_remote_addr zone=global_limit:10m  rate=1000r/m;

    # Shared 429 response
    limit_req_status 429;

    # ── Upstream service definitions ──────────────────────────────────────────
    upstream auth_service {
        server auth-service:3000;
        keepalive 32;
    }

    upstream user_service {
        server user-service:3001;
        keepalive 32;
    }

    upstream upload_service {
        server upload-service:3002;
        keepalive 16;
    }

    upstream orchestrator_service {
        server conversion-orchestrator:3003;
        keepalive 32;
    }

    upstream billing_service {
        server billing-service:3004;
        keepalive 16;
    }

    upstream notification_service {
        server notification-service:3005;
        keepalive 16;
    }

    upstream admin_service {
        server admin-service:3006;
        keepalive 16;
    }

    # ── Include per-server configs ────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
