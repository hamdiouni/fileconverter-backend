server {
    listen 80;
    server_name _;

    # Redirect HTTP → HTTPS in production (comment out for local dev)
    # return 301 https://$host$request_uri;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "DENY"             always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Referrer-Policy         "no-referrer"      always;

    # ── Health / readiness ──────────────────────────────────────────────────
    location /healthz {
        access_log off;
        return 200 '{"status":"ok","service":"api-gateway"}';
        add_header Content-Type application/json;
    }

    # ── Auth Service ────────────────────────────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=global_limit burst=50 nodelay;
        limit_req_log_level warn;

        proxy_pass         http://auth_service;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Rate limit exceeded → 429 with Retry-After header (Req 1.5)
        add_header Retry-After "3600" always;
    }

    # ── User Service ────────────────────────────────────────────────────────
    location /api/v1/users/ {
        limit_req zone=global_limit burst=100 nodelay;

        proxy_pass         http://user_service;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Upload Service ──────────────────────────────────────────────────────
    location /api/v1/uploads/ {
        limit_req zone=global_limit burst=20 nodelay;

        client_max_body_size 0; # presigned URLs handled by S3, not proxied body
        proxy_pass         http://upload_service;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Conversion Orchestrator ─────────────────────────────────────────────
    location /api/v1/conversions/ {
        limit_req zone=global_limit burst=200 nodelay;

        proxy_pass         http://orchestrator_service;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Billing Service ─────────────────────────────────────────────────────
    location /api/v1/billing/ {
        limit_req zone=global_limit burst=20 nodelay;

        proxy_pass         http://billing_service;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Stripe webhooks need raw body — no body buffering
        proxy_request_buffering off;
        proxy_read_timeout 30s;
    }

    # ── Notification Service ────────────────────────────────────────────────
    location /api/v1/notifications/ {
        limit_req zone=global_limit burst=50 nodelay;

        proxy_pass         http://notification_service;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Admin Service ────────────────────────────────────────────────────────
    location /api/v1/admin/ {
        # Admin endpoints get tighter rate limiting
        limit_req zone=global_limit burst=10 nodelay;

        proxy_pass         http://admin_service;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Catch-all 404 ────────────────────────────────────────────────────────
    location / {
        return 404 '{"error":{"code":"NOT_FOUND","message":"Route not found"}}';
        add_header Content-Type application/json;
    }

    # ── Custom error pages ───────────────────────────────────────────────────
    error_page 429 @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After "3600" always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Rate limit exceeded. See Retry-After header."}}';
    }

    error_page 502 503 504 @gateway_error;
    location @gateway_error {
        default_type application/json;
        return 502 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Upstream service unavailable"}}';
    }
}

