[tool.poetry]
name = "document-worker"
version = "1.0.0"
description = "Document conversion worker for FileConverter Pro"
authors = ["FileConverter Pro"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
boto3 = "^1.34.0"
redis = "^5.0.1"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
structlog = "^24.1.0"
prometheus-client = "^0.20.0"
pdf2docx = "^0.5.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
pytest-mock = "^3.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
