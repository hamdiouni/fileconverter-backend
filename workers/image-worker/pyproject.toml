[tool.poetry]
name = "image-worker"
version = "1.0.0"
description = "Image conversion worker for FileConverter Pro"
authors = ["FileConverter Pro"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
Pillow = "^10.2.0"
boto3 = "^1.34.0"
redis = "^5.0.1"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
structlog = "^24.1.0"
prometheus-client = "^0.20.0"
piexif = "^1.1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
pytest-asyncio = "^0.23.5"
pytest-mock = "^3.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
