# FileConverter Pro – Docker Compose (development)
# Usage:  docker compose up --build
#
# Services exposed on host:
#   Frontend  → http://localhost:8080
#   API       → http://localhost:80/api/v1
#   MinIO UI  → http://localhost:9001
#   Mailhog   → http://localhost:8025
#   Grafana   → http://localhost:3100

networks:
  fileconverter-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:

  # ═══════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    container_name: fc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fileconverter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fileconverter_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fileconverter}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fileconverter-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fileconverter} -d ${POSTGRES_DB:-fileconverter}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: fc_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - fileconverter-net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: fc_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - fileconverter-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Create MinIO buckets on first boot
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: fc_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - fileconverter-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin_dev};
        mc mb --ignore-existing local/fileconverter-uploads;
        mc mb --ignore-existing local/fileconverter-results;
        mc mb --ignore-existing local/fileconverter-temp;
        echo 'MinIO buckets ready';
      "
    restart: on-failure

  mailhog:
    image: mailhog/mailhog:latest
    container_name: fc_mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_HTTP_PORT:-8025}:8025"
    networks:
      - fileconverter-net

  # DB migration – runs once, then exits
  db-migrate:
    image: node:20-alpine
    container_name: fc_db_migrate
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fileconverter-net
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
    volumes:
      - ./prisma:/app/prisma:ro
    working_dir: /app
    command: >
      sh -c "
        apk add --no-cache openssl 2>/dev/null;
        npm install -g prisma@5 --silent 2>/dev/null;
        prisma db push --accept-data-loss;
        echo 'Database schema applied';
      "
    restart: on-failure

  # ═══════════════════════════════════════════════════════════
  # FRONTEND
  # ═══════════════════════════════════════════════════════════

  frontend:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: fc_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
    networks:
      - fileconverter-net
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════
  # API GATEWAY
  # ═══════════════════════════════════════════════════════════

  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    container_name: fc_api_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
    depends_on:
      - auth-service
      - user-service
      - upload-service
      - orchestrator-service
      - billing-service
      - notification-service
      - admin-service
    networks:
      - fileconverter-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════
  # BACKEND SERVICES
  # ═══════════════════════════════════════════════════════════

  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: fc_auth_service
    restart: unless-stopped
    ports:
      - "${AUTH_SERVICE_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  user-service:
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
    container_name: fc_user_service
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  upload-service:
    build:
      context: .
      dockerfile: ./services/upload-service/Dockerfile
    container_name: fc_upload_service
    restart: unless-stopped
    ports:
      - "${UPLOAD_SERVICE_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  orchestrator-service:
    build:
      context: .
      dockerfile: ./services/conversion-orchestrator/Dockerfile
    container_name: fc_orchestrator_service
    restart: unless-stopped
    ports:
      - "${ORCHESTRATOR_SERVICE_PORT:-3003}:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  billing-service:
    build:
      context: .
      dockerfile: ./services/billing-service/Dockerfile
    container_name: fc_billing_service
    restart: unless-stopped
    ports:
      - "${BILLING_SERVICE_PORT:-3004}:3004"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  notification-service:
    build:
      context: .
      dockerfile: ./services/notification-service/Dockerfile
    container_name: fc_notification_service
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-3005}:3005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3005
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  admin-service:
    build:
      context: .
      dockerfile: ./services/admin-service/Dockerfile
    container_name: fc_admin_service
    restart: unless-stopped
    ports:
      - "${ADMIN_SERVICE_PORT:-3006}:3006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3006
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ═══════════════════════════════════════════════════════════
  # CONVERSION WORKERS (Python)
  # ═══════════════════════════════════════════════════════════

  image-worker:
    build:
      context: ./workers/image-worker
      dockerfile: Dockerfile
    container_name: fc_image_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      WORKER_CONCURRENCY: ${IMAGE_WORKER_CONCURRENCY:-2}

  video-worker:
    build:
      context: ./workers/video-worker
      dockerfile: Dockerfile
    container_name: fc_video_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-1}

  audio-worker:
    build:
      context: ./workers/audio-worker
      dockerfile: Dockerfile
    container_name: fc_audio_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      WORKER_CONCURRENCY: ${AUDIO_WORKER_CONCURRENCY:-2}

  document-worker:
    build:
      context: ./workers/document-worker
      dockerfile: Dockerfile
    container_name: fc_document_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      WORKER_CONCURRENCY: ${DOCUMENT_WORKER_CONCURRENCY:-2}

  archive-worker:
    build:
      context: ./workers/archive-worker
      dockerfile: Dockerfile
    container_name: fc_archive_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      WORKER_CONCURRENCY: ${ARCHIVE_WORKER_CONCURRENCY:-1}

  cad-font-worker:
    build:
      context: ./workers/cad-font-worker
      dockerfile: Dockerfile
    container_name: fc_cad_font_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      WORKER_CONCURRENCY: ${CAD_WORKER_CONCURRENCY:-1}

  # ═══════════════════════════════════════════════════════════
  # MONITORING
  # ═══════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: fc_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - fileconverter-net

  grafana:
    image: grafana/grafana:10.3.1
    container_name: fc_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    networks:
      - fileconverter-net

  loki:
    image: grafana/loki:2.9.4
    container_name: fc_loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3200}:3100"
    volumes:
      - ./infrastructure/monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yml
    networks:
      - fileconverter-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: fc_alertmanager
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./infrastructure/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - fileconverter-net
