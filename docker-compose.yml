# FileConverter Pro – Docker Compose (development)
# Usage:  docker compose up --build
#
# Services exposed on host:
#   Frontend  → http://localhost:8080
#   API       → http://localhost:80/api/v1
#   MinIO UI  → http://localhost:9001
#   Mailhog   → http://localhost:8025
#   Grafana   → http://localhost:3100

networks:
  fileconverter-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:

  # ═══════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fileconverter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fileconverter_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fileconverter}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fileconverter-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fileconverter} -d ${POSTGRES_DB:-fileconverter}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - fileconverter-net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - fileconverter-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Create MinIO buckets on first boot
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - fileconverter-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin_dev};
        mc mb --ignore-existing local/fileconverter-uploads;
        mc mb --ignore-existing local/fileconverter-results;
        mc mb --ignore-existing local/fileconverter-temp;
        echo 'MinIO buckets ready';
      "
    restart: on-failure

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_HTTP_PORT:-8025}:8025"
    networks:
      - fileconverter-net

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    networks:
      - fileconverter-net
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # DB migration – runs once, then exits
  db-migrate:
    image: node:20-alpine
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fileconverter-net
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
    volumes:
      - ./prisma:/app/prisma:ro
    working_dir: /app
    command: >
      sh -c "
        apk add --no-cache openssl 2>/dev/null;
        npm install -g prisma@5 --silent 2>/dev/null;
        prisma migrate deploy;
        echo 'Database migrations successfully applied';
      "
    restart: on-failure

  # ═══════════════════════════════════════════════════════════
  # API GATEWAY (Single Entrypoint for all Backend Traffic)
  # ═══════════════════════════════════════════════════════════

  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
    depends_on:
      - auth-service
      - user-service
      - upload-service
      - orchestrator-service
      - billing-service
      - notification-service
      - admin-service
    networks:
      - fileconverter-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════
  # FRONTEND (Next.js Application)
  # ═══════════════════════════════════════════════════════════

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=8080
      - NEXT_PUBLIC_API_URL=http://localhost:80/api/v1
      - NEXT_PUBLIC_S3_ENDPOINT=http://localhost:9000
      - NEXT_PUBLIC_SITE_URL=http://localhost:8080
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-466195313627-mf3t35danp4mqqq4d5vq8h6k2qdpclql.apps.googleusercontent.com}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-466195313627-mf3t35danp4mqqq4d5vq8h6k2qdpclql.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - AUTH_SERVICE_INTERNAL_URL=http://auth-service:3000
    networks:
      - fileconverter-net
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ═══════════════════════════════════════════════════════════
  # BACKEND SERVICES (Internal to fileconverter-net, no host port clutter)
  # ═══════════════════════════════════════════════════════════

  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fileconverter.io}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  user-service:
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  upload-service:
    build:
      context: .
      dockerfile: ./services/upload-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      GUEST_DAILY_LIMIT: 1000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  orchestrator-service:
    build:
      context: .
      dockerfile: ./services/conversion-orchestrator/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3003
      GUEST_DAILY_LIMIT: 1000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-fileconverter-uploads}
      S3_BUCKET_RESULTS: ${S3_BUCKET_RESULTS:-fileconverter-results}
      ORCHESTRATOR_INTERNAL_URL: http://orchestrator-service:3003
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  billing-service:
    build:
      context: .
      dockerfile: ./services/billing-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_replace_in_production_min_64_chars}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  notification-service:
    build:
      context: .
      dockerfile: ./services/notification-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3005
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:-dev_webhook_hmac_secret_32chars_long!}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  admin-service:
    build:
      context: .
      dockerfile: ./services/admin-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3006
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  cleanup-service:
    build:
      context: .
      dockerfile: ./services/cleanup-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fileconverter}:${POSTGRES_PASSWORD:-fileconverter_dev}@postgres:5432/${POSTGRES_DB:-fileconverter}
      S3_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-fileconverter-uploads}
      S3_BUCKET_RESULTS: ${S3_BUCKET_RESULTS:-fileconverter-results}
      METRICS_PORT: 9090
      CLEANUP_SCHEDULE_FILES: "0 2 * * *"
      CLEANUP_SCHEDULE_DB: "0 3 * * *"
      CLEANUP_RETENTION_FREE: 7
      CLEANUP_RETENTION_PRO: 14
      CLEANUP_RETENTION_BUSINESS: 30
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ═══════════════════════════════════════════════════════════
  # CONVERSION WORKERS (Python)
  # ═══════════════════════════════════════════════════════════

  image-worker:
    build:
      context: ./workers/image-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      WORKER_CONCURRENCY: ${IMAGE_WORKER_CONCURRENCY:-2}

  video-worker:
    build:
      context: ./workers/video-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-1}

  audio-worker:
    build:
      context: ./workers/audio-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      WORKER_CONCURRENCY: ${AUDIO_WORKER_CONCURRENCY:-2}

  document-worker:
    build:
      context: ./workers/document-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      WORKER_CONCURRENCY: ${DOCUMENT_WORKER_CONCURRENCY:-2}

  archive-worker:
    build:
      context: ./workers/archive-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      WORKER_CONCURRENCY: ${ARCHIVE_WORKER_CONCURRENCY:-1}

  cad-font-worker:
    build:
      context: ./workers/cad-font-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - fileconverter-net
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      WORKER_CONCURRENCY: ${CAD_WORKER_CONCURRENCY:-1}

  # ═══════════════════════════════════════════════════════════
  # MONITORING
  # ═══════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:v2.49.1
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - fileconverter-net

  grafana:
    image: grafana/grafana:10.3.1
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    networks:
      - fileconverter-net

  loki:
    image: grafana/loki:2.9.4
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3200}:3100"
    volumes:
      - ./infrastructure/monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yml
    networks:
      - fileconverter-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./infrastructure/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - fileconverter-net
