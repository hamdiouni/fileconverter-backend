global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-receiver'

receivers:
  - name: 'default'
    webhook_configs:
      - url: '${ALERTMANAGER_WEBHOOK_URL:-http://localhost:9090/alert}'
        send_resolved: true

  - name: 'critical-receiver'
    webhook_configs:
      - url: '${PAGERDUTY_WEBHOOK_URL:-http://localhost:9090/pagerduty}'
        send_resolved: true
    # Uncomment and configure for Slack:
    # slack_configs:
    #   - api_url: '${SLACK_WEBHOOK_URL}'
    #     channel: '#alerts-critical'
    #     title: '[CRITICAL] {{ .CommonAnnotations.summary }}'
    #     text: '{{ .CommonAnnotations.description }}'

  - name: 'warning-receiver'
    webhook_configs:
      - url: '${SLACK_WEBHOOK_URL:-http://localhost:9090/slack}'
        send_resolved: true
    # Uncomment and configure for Slack:
    # slack_configs:
    #   - api_url: '${SLACK_WEBHOOK_URL}'
    #     channel: '#alerts-warning'
    #     title: '[WARNING] {{ .CommonAnnotations.summary }}'
    #     text: '{{ .CommonAnnotations.description }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
